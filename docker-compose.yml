services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airplanes
      POSTGRES_PASSWORD: airplanes
      POSTGRES_DB: airplanes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airplanes"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://airplanes:airplanes@postgres:5432/airplanes_db
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
